<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leafmark promotional artwork</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:"Segoe UI",Arial,sans-serif;background:#073d31;color:#f4fff8}
    .canvas{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 12%,#3fae826b,transparent 56%),radial-gradient(ellipse at 15% 88%,#b2eed722,transparent 64%),linear-gradient(120deg,#073d31,#125744)}
    .halo{position:absolute;width:380px;height:380px;left:-150px;top:-270px;border:1px solid #e4ffef27;border-radius:50%;box-shadow:0 0 0 35px #ddffe608,0 0 0 75px #ddffe605}
    .brand{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;z-index:2}
    .brand img{width:104px;height:104px;filter:drop-shadow(0 12px 24px #001f2359)}
    .name{font-size:48px;font-weight:600;letter-spacing:-2px;line-height:1.1}
    .cards{position:absolute;width:250px;right:-110px;bottom:-15px;display:grid;grid-template-columns:1fr 1fr;gap:14px;transform:rotate(-12deg);opacity:.5}
    .card{height:65px;border:1px solid #e7fff726;border-radius:16px;background:linear-gradient(130deg,#d5ffec2b,#d5ffec09);box-shadow:0 12px 22px #002b2518;display:flex;align-items:center;padding:17px;gap:12px}
    .dot{width:22px;height:22px;border-radius:7px;background:#a0e2c481;flex:none}.line{height:5px;background:#d6f9e663;flex:1;border-radius:4px}
    .wide .halo{width:860px;height:860px;left:-380px;top:-660px;box-shadow:0 0 0 65px #ddffe608,0 0 0 140px #ddffe605}
    .wide .brand{right:auto;left:112px;flex-direction:row;gap:36px}.wide .brand img{width:150px;height:150px}.wide .name{font-size:96px;letter-spacing:-4px}
    .wide .cards{width:430px;right:74px;bottom:108px;gap:22px;transform:rotate(-8deg);opacity:1}.wide .card{height:110px;padding:24px;border-radius:24px}.wide .dot{width:36px;height:36px;border-radius:11px}.wide .line{height:7px}
  </style>
</head>
<body>
  <div class="canvas"><div class="halo"></div><div class="cards" aria-hidden="true"><div class="card"><i class="dot"></i><i class="line"></i></div><div class="card"><i class="dot"></i><i class="line"></i></div><div class="card"><i class="dot"></i><i class="line"></i></div><div class="card"><i class="dot"></i><i class="line"></i></div></div><div class="brand"><img src="../icons/brand-512.png" alt=""><span class="name">Leafmark</span></div></div>
  <script>if(new URLSearchParams(location.search).get('format')==='marquee')document.body.classList.add('wide')</script>
</body>
</html>
